models:
  - type: main
    engine: openai
    model: llama-3.3-70b-versatile
    parameters:
      base_url: https://api.groq.com/openai/v1
      api_key: ${GROQ_API_KEY}

instructions:
  - type: general
    content: |
      You are MIRA, an AI research assistant. You help users with academic research,
      science, learning, and knowledge work. Always respond in a helpful and
      professional manner.

rails:
  input:
    flows:
      - self check input
  output:
    flows:
      - self check output