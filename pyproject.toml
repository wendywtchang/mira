[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mira_backend.settings"
pythonpath = [".", "mira_backend"]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning:nemoguardrails",
    "ignore::DeprecationWarning:langchain_community",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "data/",
    "tests/logs/",
    "modules/guardrails/config/",
]

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort
select = ["E", "F", "I"]
ignore = [
    "E501",  # line too long — ruff format handles this
]
